<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
<title id="title">Voiceframe — Give your story a voice.</title>
<desc id="desc">暖白纸色、黑色大字与朱红色画面，声波穿过层叠的取景框。</desc>
<rect width="1440" height="640" fill="#f3f0e9"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#20211f">
<text x="64" y="58" font-size="13" letter-spacing="3">VOICEFRAME / NARRATED VIDEO WORKFLOW</text>
<text x="1376" y="58" text-anchor="end" font-size="13" letter-spacing="2">WORDS INTO WORLDS</text>
<path d="M64 82H1376" stroke="#20211f" stroke-opacity=".25"/>
<text x="55" y="253" font-size="165" font-weight="700" letter-spacing="-10">Voiceframe<tspan fill="#e05236">.</tspan></text>
<text x="66" y="331" font-size="47" font-family="Georgia, 'Times New Roman', serif" font-style="italic" letter-spacing="-1">Give your story a voice.</text>
<text x="68" y="405" font-size="19" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#66665f" letter-spacing="3">把故事讲清楚，让画面跟上声音。</text>
<text x="68" y="554" font-size="12" letter-spacing="2">STORY FIRST.</text>
<text x="68" y="578" font-size="12" letter-spacing="2" fill="#797971">VOICE LED. FRAME BY FRAME.</text>
</g>
